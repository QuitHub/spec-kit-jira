schema_version: "1.0"

extension:
  id: "jira"
  name: "Jira Integration"
  version: "3.1.0"
  description: "Create Jira Epics, Stories, and Issues from spec-kit artifacts"
  author: "Luke Matthews"
  repository: "https://github.com/QuitHub/spec-kit-jira"
  license: "MIT"
  homepage: "https://github.com/QuitHub/spec-kit-jira"

requires:
  speckit_version: ">=0.1.0"
  # Note: Requires an MCP server providing Jira/Atlassian tools
  # The server name is configurable via mcp_server in jira-config.yml
  # Common names: "atlassian", "jira-mcp-server", "jira"

provides:
  commands:
    - name: "speckit.jira.spectostories"
      file: "commands/spectostories.md"
      description: "Create Jira Epic and Stories from spec.md user stories (no tasks.md required)"

    - name: "speckit.jira.specstoissues"
      file: "commands/specstoissues.md"
      description: "Create Jira hierarchy from spec and tasks"
      aliases: ["speckit.specstoissues"]

    - name: "speckit.jira.discover-fields"
      file: "commands/discover-fields.md"
      description: "Discover Jira custom fields for configuration"

    - name: "speckit.jira.sync-status"
      file: "commands/sync-status.md"
      description: "Sync task completion status to Jira"

  config:
    - name: "jira-config.yml"
      template: "jira-config.template.yml"
      description: "Jira integration configuration"
      required: true

hooks:
  after_specify:
    command: "speckit.jira.spectostories"
    optional: true
    prompt: "Create Jira Epic and Stories before planning?"
    description: "Create Jira Epic and Stories from spec user stories after spec creation"
  after_tasks:
    command: "speckit.jira.specstoissues"
    optional: true
    prompt: "Create Jira issues from tasks?"
    description: "Automatically create Jira hierarchy after task generation"

tags:
  - "issue-tracking"
  - "jira"
  - "atlassian"
  - "project-management"

defaults:
  mcp_server: "atlassian"
  project:
    key: ""
  spectostories:
    spec_artifact: "Epic"
    story_artifact: "Story"
    spec_story_relationship: "Parent"
  mapping:
    spec_artifact: "Epic"
    phase_artifact: "Story"
    task_artifact: "Task"
    relationships:
      spec_phase: "Epic Link"
      phase_task: "Relates"
      spec_task: "Epic Link"
  defaults:
    spec:
      labels: []
    phase:
      labels: []
    task:
      labels: []
